<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Подключение VK к tg2max</title>
  <style>
    body{font:16px system-ui,sans-serif;max-width:680px;margin:60px auto;padding:0 20px;color:#171717}
    button{padding:12px 18px;border:0;border-radius:10px;background:#07f;color:#fff;font:inherit;cursor:pointer}
    textarea{box-sizing:border-box;width:100%;height:130px;margin:12px 0;padding:12px}
    .muted{color:#666}.error{color:#b00020;white-space:pre-wrap}
  </style>
</head>
<body>
  <h1>Подключение VK</h1>
  <p id="status">Нажмите кнопку и разрешите приложению публикацию в VK.</p>
  <button id="login">Войти через VK</button>
  <section id="result" hidden>
    <p><b>Код подключения получен.</b> Скопируйте его и отправьте боту @getChanelDataBot. Код одноразовый.</p>
    <textarea id="token" readonly></textarea>
    <button id="copy">Скопировать код подключения</button>
  </section>
  <p id="error" class="error"></p>
  <p class="muted">OAuth-код обрабатывается только в этом браузере и передаётся серверу исключительно через личный чат с ботом.</p>
  <script src="vkid-sdk.js"></script>
  <script>
    const APP_ID=54787264;
    const REDIRECT='https://semyonchick.github.io/tg2max/vk-callback.html';
    const VKID=window.VKIDSDK;
    const params=new URLSearchParams(location.search);
    const returnedCode=params.get('code');
    const returnedDevice=params.get('device_id');
    const savedVerifier=localStorage.getItem('vk_oauth_verifier');
    const state=localStorage.getItem('vk_oauth_state')||(crypto.randomUUID?crypto.randomUUID():String(Date.now()));
    localStorage.setItem('vk_oauth_state',state);
    const verifier=savedVerifier||randomVerifier();
    localStorage.setItem('vk_oauth_verifier',verifier);
    function randomVerifier(){
      const bytes=crypto.getRandomValues(new Uint8Array(48));
      return btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    }
    async function challenge(value){
      const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(value));
      return btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    }
    function showError(error){document.querySelector('#error').textContent=typeof error==='string'?error:JSON.stringify(error,null,2)}
    const ready=(async()=>{
      if(!VKID) throw new Error('VK ID SDK не загрузился. Обновите страницу без блокировщика рекламы.');
      VKID.Config.init({app:APP_ID,redirectUrl:REDIRECT,state,codeVerifier:verifier,codeChallenge:await challenge(verifier),scope:'wall photos video groups',mode:VKID.ConfigAuthMode.Redirect});
    })().catch(error=>{showError(error);throw error});
    document.querySelector('#login').onclick=async()=>{
      try{await ready;await VKID.Auth.login()}catch(error){showError(error)}
    };
    document.querySelector('#copy').onclick=async()=>{await navigator.clipboard.writeText(document.querySelector('#token').value);document.querySelector('#copy').textContent='Скопировано'};
    if(returnedCode&&returnedDevice&&savedVerifier){
      document.querySelector('#login').hidden=true;
      document.querySelector('#status').textContent='Проверяем ответ VK…';
      ready.then(()=>{
        const payload=JSON.stringify({code:returnedCode,device_id:returnedDevice,code_verifier:verifier,state});
        const bytes=new TextEncoder().encode(payload);
        let binary=''; bytes.forEach(value=>binary+=String.fromCharCode(value));
        document.querySelector('#status').textContent='Авторизация подтверждена.';
        document.querySelector('#token').value='VKCODE.'+btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
        document.querySelector('#result').hidden=false;
        localStorage.removeItem('vk_oauth_verifier');
        localStorage.removeItem('vk_oauth_state');
        history.replaceState({},'',REDIRECT);
      }).catch(showError);
    }else if(returnedCode){
      history.replaceState({},'',REDIRECT);
      showError('Предыдущая попытка устарела. Нажмите «Войти через VK» ещё раз.');
    }
  </script>
</body>
</html>
