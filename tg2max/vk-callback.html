<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Подключение VK к tg2max</title>
  <style>
    body{font:16px system-ui,sans-serif;max-width:680px;margin:60px auto;padding:0 20px;color:#171717}
    button{padding:12px 18px;border:0;border-radius:10px;background:#07f;color:#fff;font:inherit;cursor:pointer}
    textarea{box-sizing:border-box;width:100%;height:130px;margin:12px 0;padding:12px}
    .muted{color:#666}.error{color:#b00020;white-space:pre-wrap}
  </style>
</head>
<body>
  <h1>Подключение VK</h1>
  <p id="status">Нажмите кнопку и разрешите приложению публикацию в VK.</p>
  <button id="login">Войти через VK</button>
  <section id="result" hidden>
    <p><b>Токен получен.</b> Скопируйте его и отправьте боту @getChanelDataBot. Не пересылайте токен другим людям.</p>
    <textarea id="token" readonly></textarea>
    <button id="copy">Скопировать токен</button>
  </section>
  <p id="error" class="error"></p>
  <p class="muted">Токен обрабатывается только в этом браузере и никуда с этой страницы не отправляется.</p>
  <script src="https://unpkg.com/@vkid/sdk@2.6.1/dist-sdk/umd/index.js"></script>
  <script>
    const APP_ID=54787264;
    const REDIRECT='https://semyonchick.github.io/tg2max/vk-callback.html';
    const VKID=window.VKIDSDK;
    const params=new URLSearchParams(location.search);
    const state=sessionStorage.getItem('vk_oauth_state')||crypto.randomUUID();
    sessionStorage.setItem('vk_oauth_state',state);
    VKID.Config.init({app:APP_ID,redirectUrl:REDIRECT,state,scope:'wall photos video groups offline',mode:VKID.ConfigAuthMode.Redirect});
    document.querySelector('#login').onclick=()=>VKID.Auth.login().catch(showError);
    document.querySelector('#copy').onclick=async()=>{await navigator.clipboard.writeText(document.querySelector('#token').value);document.querySelector('#copy').textContent='Скопировано'};
    function showError(error){document.querySelector('#error').textContent=typeof error==='string'?error:JSON.stringify(error,null,2)}
    if(params.get('code')&&params.get('device_id')){
      document.querySelector('#login').hidden=true;
      document.querySelector('#status').textContent='Проверяем ответ VK…';
      VKID.Auth.exchangeCode(params.get('code'),params.get('device_id')).then(data=>{
        document.querySelector('#status').textContent='Авторизация завершена.';
        document.querySelector('#token').value=data.access_token;
        document.querySelector('#result').hidden=false;
        history.replaceState({},'',REDIRECT);
      }).catch(showError);
    }
  </script>
</body>
</html>
